<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>if(location.pathname.endsWith('/index.html')){history.replaceState(null,'',location.pathname.slice(0,-10)+location.search+location.hash)}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1C0D06">
  <title>Sin conexión — Melita Coffe</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brown-900: #1C0D06;
      --brown-800: #2C1A0E;
      --brown-700: #3A2010;
      --amber:     #C8924A;
      --amber-light: #E8B87A;
      --cream:     #F5ECD5;
    }

    body {
      min-height: 100dvh;
      background: var(--brown-900);
      color: var(--cream);
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .offline-card {
      background: var(--brown-800);
      border: 1px solid rgba(200,146,74,.2);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 24px 80px rgba(0,0,0,.6);
      animation: fadeUp .5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .offline-icon {
      font-size: 64px;
      margin-bottom: 20px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.07); }
    }

    .brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--amber);
      margin-bottom: 4px;
    }

    .brand-sub {
      font-size: .75rem;
      letter-spacing: 6px;
      color: var(--amber-light);
      opacity: .7;
      margin-bottom: 28px;
    }

    h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--cream);
    }

    p {
      font-size: .9rem;
      line-height: 1.6;
      color: rgba(245,236,213,.65);
      margin-bottom: 32px;
    }

    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--amber);
      color: var(--brown-900);
      font-family: inherit;
      font-size: .95rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
      margin-bottom: 16px;
      width: 100%;
      justify-content: center;
    }

    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200,146,74,.4);
    }

    .retry-btn:active { transform: scale(.97); }

    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      color: #25D366;
      border: 1.5px solid #25D366;
      border-radius: 50px;
      padding: 13px 28px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s, color .2s;
      width: 100%;
      justify-content: center;
    }

    .wa-btn:hover {
      background: #25D366;
      color: #fff;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(200,146,74,.15);
      margin: 24px 0;
    }

    .tips {
      font-size: .78rem;
      color: rgba(245,236,213,.4);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="offline-icon">🌐</div>
    <div class="brand">MELITA</div>
    <div class="brand-sub">coffe</div>

    <h1>Parece que no tienes internet</h1>
    <p>No te preocupes, puedes volver a intentarlo o contactarnos directamente por WhatsApp para hacer tu pedido.</p>

    <button class="retry-btn" onclick="window.location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/>
      </svg>
      Reintentar conexión
    </button>

    <a class="wa-btn"
       href="https://wa.me/51941679505?text=%C2%A1Hola%20Melita%20Coffe!%20Quiero%20hacer%20un%20pedido"
       target="_blank">
      <svg width="18" height="18" viewBox="0 0 32 32" fill="currentColor">
        <path d="M16 0C7.163 0 0 7.163 0 16c0 2.817.733 5.463 2.018 7.773L0 32l8.418-2.188A15.924 15.924 0 0016 32c8.837 0 16-7.163 16-16S24.837 0 16 0zm7.273 19.346c-.399-.2-2.36-1.163-2.726-1.296-.365-.133-.631-.2-.897.2-.266.4-1.031 1.296-1.264 1.562-.233.266-.465.3-.864.1-.4-.2-1.688-.622-3.214-1.981-1.188-1.058-1.99-2.365-2.223-2.764-.233-.4-.025-.616.175-.815.18-.179.4-.466.6-.699.2-.233.266-.4.4-.666.133-.266.066-.5-.033-.7-.1-.2-.897-2.162-1.229-2.961-.324-.778-.652-.672-.897-.685l-.765-.013c-.266 0-.698.1-1.065.5-.365.4-1.396 1.363-1.396 3.325 0 1.962 1.43 3.858 1.629 4.124.2.266 2.814 4.298 6.818 6.027.953.411 1.696.657 2.275.841.956.304 1.827.261 2.515.158.767-.114 2.36-.964 2.693-1.896.333-.932.333-1.73.233-1.896-.1-.166-.365-.266-.765-.466z"/>
      </svg>
      Pedir por WhatsApp
    </a>

    <hr class="divider">
    <p class="tips">
      📍 Coronel Arguedas #809, Bambamarca<br>
      📞 941 679 505 · Delivery en Bambamarca
    </p>
  </div>
</body>
</html>
